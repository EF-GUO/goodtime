name: Custom icon APK
on:
  push:
    branches: [custom-icon-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - name: Check Android SDK
        run: sdkmanager --list_installed
      - name: Check dependency repositories and Java
        shell: bash
        run: |
          java -version
          echo "JDK17=$JAVA_HOME_17_X64"
          echo "JDK21=$JAVA_HOME_21_X64"
          for url in 'https://plugins.gradle.org/m2/org/gradle/toolchains/foojay-resolver-convention/org.gradle.toolchains.foojay-resolver-convention.gradle.plugin/1.0.0/org.gradle.toolchains.foojay-resolver-convention.gradle.plugin-1.0.0.pom' 'https://repo.maven.apache.org/maven2/' 'https://dl.google.com/dl/android/maven2/master-index.xml'; do
            curl -L -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code} %{url_effective}\n' "$url" || true
          done
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace --info -Porg.gradle.java.installations.auto-download=false :androidApp:assembleFdroidRelease
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/fdroid/release -name '*.apk' ! -name '*unsigned*' -print -quit)
          test -n "$apk"
          mkdir -p out
          cp "$apk" out/Goodtime-3.3.0-Original-Logo.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs out/Goodtime-3.3.0-Original-Logo.apk
          "$tools/aapt2" dump badging out/Goodtime-3.3.0-Original-Logo.apk > out/apk-info.txt
          head -8 out/apk-info.txt
          python3 -c 'import zipfile,hashlib; z=zipfile.ZipFile("out/Goodtime-3.3.0-Original-Logo.apk"); assert any(hashlib.sha256(z.read(n)).hexdigest()=="0a274e904091f15728a823897c9affd1d801be2a71d7e3c995961b1ca4dd30a9" for n in z.namelist() if n.endswith(".webp")), "Original icon bytes missing"'
          (cd out && sha256sum Goodtime-3.3.0-Original-Logo.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: Goodtime-Original-Logo-APK
          path: out/
          if-no-files-found: error
